<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../Shared/global.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="./budgets.css">
    <title>Budgets | SmartBudget</title>
</head>
<body class="app-bg">
    <div class="app-layout"><aside id="sidebar" class="sidebar"></aside><main class="main-content"><div id="topbar" class="topbar"></div><section class="card page-card"><h2>Set monthly budget</h2><form id="budgetForm" class="grid grid-4 form-grid"><input type="hidden" id="budgetId"><div class="form-group"><label>Monthly limit</label><input type="number" step="0.01" id="monthlyLimit" required></div><div class="form-group"><label>Month</label><input type="number" min="1" max="12" id="month" required></div><div class="form-group"><label>Year</label><input type="number" id="year" required></div><button class="btn" type="submit">Save budget</button><p id="budgetMessage" class="message"></p></form></section><section class="card"><h2>My budgets</h2><div class="table-wrapper"><table class="table"><thead><tr><th>Month</th><th>Year</th><th>Limit</th><th>Action</th></tr></thead><tbody id="budgetsTable"></tbody></table></div></section></main></div>
    <script src="../Shared/config.js"></script>
    <script src="../Shared/api.js"></script>
    <script src="../Shared/auth.js"></script>
    <script src="../Shared/helpers.js"></script>
    <script src="../Shared/layout.js"></script>
    <script src="../Shared/modal.js"></script>
    <script src="../Shared/notifications.js"></script>
    <script src="../Shared/notification-center.js"></script>
    <script src="./budgets.js"></script>
</body>
</html>
