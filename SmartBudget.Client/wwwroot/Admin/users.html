<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Users | SmartBudget</title>

    <link rel="stylesheet" href="../Shared/global.css">
    <link rel="stylesheet" href="./users.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body class="app-bg" data-page="admin-users" data-title="Admin Users">
    <div class="app-layout">
        <aside id="sidebar" class="sidebar"></aside>

        <main class="main-content">
            <header id="topbar" class="topbar"></header>

            <section class="card page-card">
                <div class="section-title">
                    <h2>Users</h2>
                </div>

                <div class="table-wrapper">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>Id</th>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Created</th>
                                <th>Action</th>
                            </tr>
                        </thead>

                        <tbody id="usersTable"></tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <script src="../Shared/config.js"></script>
    <script src="../Shared/api.js"></script>
    <script src="../Shared/auth.js"></script>
    <script src="../Shared/helpers.js"></script>
    <script src="../Shared/layout.js"></script>
    <script src="../Shared/notifications.js"></script>
    <script src="../Shared/notification-center.js"></script>
    <script src="./users.js"></script>
</body>
</html>
