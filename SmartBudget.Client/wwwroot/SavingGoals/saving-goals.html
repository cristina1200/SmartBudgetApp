<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../Shared/global.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="./saving-goals.css">
    <title>Saving Goals | SmartBudget</title>
</head>
<body class="app-bg" data-page="saving-goals" data-title="Saving Goals">
    <div class="app-layout"><aside id="sidebar" class="sidebar"></aside><main class="main-content"><div id="topbar" class="topbar"></div><section class="card page-card"><h2>Create saving goal</h2><form id="goalForm" class="grid grid-3 form-grid"><input type="hidden" id="goalId"><div class="form-group"><label>Name</label><input id="name" required placeholder="Excursie Grecia"></div><div class="form-group"><label>Target amount</label><input type="number" step="0.01" id="targetAmount" required></div><div class="form-group"><label>Current amount</label><input type="number" step="0.01" id="currentAmount" value="0" required></div><div class="form-group"><label>Currency</label><select id="currency"><option value="1">RON</option><option value="2">EUR</option><option value="3">USD</option><option value="4">GBP</option></select></div><div class="form-group"><label>Deadline</label><input type="date" id="deadline"></div><button class="btn" type="submit">Save goal</button><p id="goalMessage" class="message"></p></form></section><section id="goalsGrid" class="grid grid-3"></section></main></div>
    <script src="../Shared/config.js"></script>
    <script src="../Shared/api.js"></script>
    <script src="../Shared/auth.js"></script>
    <script src="../Shared/helpers.js"></script>
    <script src="../Shared/layout.js"></script>
    <script src="../Shared/modal.js"></script>
    <script src="../Shared/notifications.js"></script>
    <script src="../Shared/notification-center.js"></script>
    <script src="./saving-goals.js"></script>
</body>
</html>
