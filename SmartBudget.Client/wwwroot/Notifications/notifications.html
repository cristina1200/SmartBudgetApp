<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Notifications | SmartBudget</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../Shared/global.css">
    <link rel="stylesheet" href="./notifications.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body class="app-bg" data-page="notifications" data-title="Notifications">
    <div class="app-layout">
        <aside id="sidebar" class="sidebar"></aside>

        <main class="main-content">
            <header id="topbar" class="topbar"></header>

            <section class="card notifications-page-card">
                <div class="notifications-page-header">
                    <div>
                        <h2>All notifications</h2>
                        <p>View all budget alerts and important messages generated by SmartBudget.</p>
                    </div>

                    <button id="markAllReadBtn" class="btn secondary-btn" type="button">
                        <i class="fa-solid fa-check-double"></i>
                        Mark all read
                    </button>
                </div>

                <div id="notificationsList" class="notifications-page-list"></div>
            </section>
        </main>
    </div>

    <script src="../Shared/config.js"></script>
    <script src="../Shared/api.js"></script>
    <script src="../Shared/auth.js"></script>
    <script src="../Shared/helpers.js"></script>
    <script src="../Shared/layout.js"></script>
    <script src="../Shared/notifications.js"></script>
    <script src="../Shared/notification-center.js"></script>
    <script src="./notifications.js"></script>
</body>
</html>
