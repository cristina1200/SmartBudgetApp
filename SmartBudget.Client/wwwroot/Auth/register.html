<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | SmartBudget</title>

    <link rel="stylesheet" href="../Shared/global.css">
    <link rel="stylesheet" href="./register.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body class="auth-page" data-auth-page="register">

    <button id="themeToggle" class="auth-theme-toggle" title="Toggle theme">
        <i id="themeIcon" class="fa-solid fa-moon"></i>
    </button>

    <div class="auth-shell register-card">
        <section class="auth-left">
            <div class="auth-logo-text">
                <img src="../Assets/logos/logo-dark.png" alt="SmartBudget logo">
                <span>SmartBudget</span>
            </div>

            <h1>Create account</h1>
            <p class="auth-subtitle">
                Start managing your budget smarter with personalized goals and savings.
            </p>

            <form id="registerForm" class="auth-form">
                <div class="grid grid-2">
                    <div class="form-group">
                        <label for="firstName">First name</label>
                        <input type="text" id="firstName" placeholder="Enter your first name" required>
                    </div>

                    <div class="form-group">
                        <label for="lastName">Last name</label>
                        <input type="text" id="lastName" placeholder="Enter your last name" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="cristina@example.com" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>

                    <div class="password-wrapper">
                        <input type="password" id="password" placeholder="Enter your password" minlength="8" required>

                        <button type="button" id="togglePassword" class="password-toggle">
                            <i class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                </div>

                <button class="auth-btn" type="submit">Create account</button>

                <p id="registerMessage" class="auth-message"></p>
            </form>

            <p class="auth-link">
                Already have an account?
                <a href="./login.html">Login</a>
            </p>
        </section>

        <section class="auth-right">
            <div class="hero-illustration">
                <img src="../Assets/illustrations/register-dark.png" alt="Register illustration">

                <h2>Start your financial journey.</h2>
                <p>
                    Create your account and organize your income, expenses and saving goals.
                </p>
            </div>
        </section>
    </div>

    <script src="../Shared/config.js"></script>
    <script src="../Shared/api.js"></script>
    <script src="../Shared/helpers.js"></script>
    <script src="./register.js"></script>
</body>
</html>
