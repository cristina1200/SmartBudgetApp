<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../Shared/global.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="./transactions.css">
    <title>Transactions | SmartBudget</title>
</head>
<body class="app-bg">
    <div class="app-layout">
        <aside id="sidebar" class="sidebar"></aside><main class="main-content">
            <div id="topbar" class="topbar"></div>
            <section class="card page-card">
                <div class="section-title"><h2>Add transaction</h2></div><form id="transactionForm" class="grid grid-3 form-grid">
                    <div class="form-group"><label>Amount</label><input type="number" step="0.01" id="amount" required></div>
                    <div class="form-group"><label>Type</label><select id="type" required><option value="1">Income</option><option value="2">Expense</option></select></div>
                    <div class="form-group"><label>Category</label><select id="categoryId" required></select></div>
                    <div class="form-group"><label>Date</label><input type="date" id="date" required></div>
                    <div class="form-group grid-span-2"><label>Description</label><input type="text" id="description" placeholder="Salary, groceries, transport..."></div>
                    <button class="btn" type="submit">Save transaction</button><p id="transactionMessage" class="message"></p>
                </form>
            </section>
            <section class="card page-card"><div class="section-title"><h2>My transactions</h2></div><div class="table-wrapper"><table class="table"><thead><tr><th>Date</th><th>Description</th><th>Category</th><th>Type</th><th>Amount</th><th>Action</th></tr></thead><tbody id="transactionsTable"></tbody></table></div></section>
        </main>
    </div>
    <script src="../Shared/config.js"></script>
    <script src="../Shared/api.js"></script>
    <script src="../Shared/auth.js"></script>
    <script src="../Shared/helpers.js"></script>
    <script src="../Shared/layout.js"></script>
    <script src="../Shared/modal.js"></script>
    <script src="../Shared/notifications.js"></script>
    <script src="./transactions.js"></script>
</body>
</html>
