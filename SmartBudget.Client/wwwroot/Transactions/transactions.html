<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transactions | SmartBudget</title>

    <link rel="stylesheet" href="../Shared/global.css">
    <link rel="stylesheet" href="./transactions.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body class="app-bg" data-page="transactions" data-title="Transactions">
    <div class="app-layout">
        <aside id="sidebar" class="sidebar"></aside>

        <main class="main-content">
            <div id="topbar" class="topbar"></div>

            <section class="card page-card">
                <div class="section-title">
                    <h2>Add transaction</h2>
                </div>

                <form id="transactionForm" class="grid grid-3 form-grid">
                    <div class="form-group">
                        <label>Amount</label>
                        <input type="number" step="0.01" id="amount" required>
                    </div>

                    <div class="form-group">
                        <label>Type</label>
                        <select id="type" required>
                            <option value="1">Income</option>
                            <option value="2">Expense</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Category</label>
                        <select id="categoryId" required></select>
                    </div>

                    <div class="form-group">
                        <label>Date</label>
                        <input type="date" id="date" required>
                    </div>

                    <div class="form-group grid-span-2">
                        <label>Description</label>
                        <input type="text" id="description" placeholder="Salary, groceries, transport...">
                    </div>

                    <button class="btn" type="submit">
                        Save transaction
                    </button>

                    <p id="transactionMessage" class="message"></p>
                </form>
            </section>

            <section class="card page-card receipt-card">
                <div class="section-title">
                    <div>
                        <h2>Scan receipt</h2>
                        <p class="section-subtitle">
                            Upload a shopping receipt and SmartBudget will try to detect the total amount.
                        </p>
                    </div>
                </div>

                <form id="receiptScanForm" class="receipt-upload-form">
                    <div class="form-group">
                        <label>Receipt image</label>
                        <input type="file" id="receiptFile" accept="image/*" required>
                    </div>

                    <button class="btn" type="submit">
                        <i class="fa-solid fa-camera"></i>
                        Scan receipt
                    </button>

                    <p id="receiptScanMessage" class="message"></p>
                </form>

                <div id="receiptPreview" class="receipt-preview hidden">
                    <div class="section-title">
                        <h2>Confirm expense</h2>
                    </div>

                    <div class="receipt-preview-grid">
                        <div class="form-group">
                            <label>Detected amount</label>
                            <input type="number" step="0.01" id="receiptAmount">
                        </div>

                        <div class="form-group">
                            <label>Date</label>
                            <input type="date" id="receiptDate">
                        </div>

                        <div class="form-group">
                            <label>Expense category</label>
                            <select id="receiptCategoryId"></select>
                        </div>

                        <div class="form-group">
                            <label>Description</label>
                            <input type="text" id="receiptDescription">
                        </div>
                    </div>

                    <div class="form-group">
                        <label>OCR text</label>
                        <textarea id="receiptRawText" readonly></textarea>
                    </div>

                    <button id="saveReceiptExpenseBtn" class="btn" type="button">
                        <i class="fa-solid fa-check"></i>
                        Save as expense
                    </button>
                </div>
            </section>

            <section class="card page-card">
                <div class="section-title">
                    <h2>My transactions</h2>
                </div>

                <div class="table-wrapper">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>Description</th>
                                <th>Category</th>
                                <th>Type</th>
                                <th>Amount</th>
                                <th>Action</th>
                            </tr>
                        </thead>

                        <tbody id="transactionsTable"></tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <script src="../Shared/config.js"></script>
    <script src="../Shared/api.js"></script>
    <script src="../Shared/auth.js"></script>
    <script src="../Shared/helpers.js"></script>
    <script src="../Shared/layout.js"></script>
    <script src="../Shared/modal.js"></script>
    <script src="../Shared/notifications.js"></script>
    <script src="../Shared/notification-center.js"></script>
    <script src="./transactions.js"></script>
</body>
</html>
