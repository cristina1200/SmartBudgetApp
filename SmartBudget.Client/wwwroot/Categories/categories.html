<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../Shared/global.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="./categories.css">
    <title>Categories | SmartBudget</title>
</head>
<body class="app-bg">
    <div class="app-layout"><aside id="sidebar" class="sidebar"></aside><main class="main-content"><div id="topbar" class="topbar"></div><section class="grid grid-2"><div class="card"><h2>Add category</h2><form id="categoryForm"><div class="form-group"><label>Name</label><input id="name" required placeholder="Food, salary, transport"></div><div class="form-group"><label>Type</label><select id="type"><option value="1">Income</option><option value="2">Expense</option></select></div><button class="btn" type="submit">Save category</button><p id="categoryMessage" class="message"></p></form></div><div class="card"><h2>My categories</h2><div id="categoriesList" class="category-list"></div></div></section></main></div>
    <script src="../Shared/config.js"></script>
    <script src="../Shared/api.js"></script>
    <script src="../Shared/auth.js"></script>
    <script src="../Shared/helpers.js"></script>
    <script src="../Shared/layout.js"></script>
    <script src="../Shared/modal.js"></script>
    <script src="../Shared/notifications.js"></script>
    <script src="../Shared/notification-center.js"></script>
    <script src="./categories.js"></script>
</body>
</html>
